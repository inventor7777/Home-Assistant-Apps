name: State Sync
version: "0.1.16"
slug: state_sync
description: Maintain desired entity states with simple entity and time syncs
url: https://github.com/inventor7777/Home-Assistant-Apps/tree/main/state_sync
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:sync
panel_title: State Sync
panel_admin: true
map:
  - type: app_config
    read_only: false
    path: /config
options:
  log_level: info
  retry_seconds: 10
  accent_light: "#2563eb"
  accent_dark: "#93b4ff"
schema:
  log_level: list(debug|info|warning|error)
  retry_seconds: int(5,300)
  accent_light: "match(^#[0-9a-fA-F]{6}$)"
  accent_dark: "match(^#[0-9a-fA-F]{6}$)"
